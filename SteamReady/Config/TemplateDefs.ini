[/Script/GameProjectGeneration.TemplateProjectDefs]
Categories=Games
LocalizedDisplayNames=(Language="en",Text="Steam Ready")
LocalizedDescriptions=(Language="en",Text="A multiplayer-ready template with Steam lobby hosting and joining, and built-in accessibility options including audio, video, and control settings. Players can connect via Steam, host or join lobbies, and customize their experience with a fully featured settings menu. Ideal for any genre looking to ship a polished multiplayer foundation.")
LocalizedDisplayNames=(Language="ko",Text="Steam Ready")
LocalizedDescriptions=(Language="ko",Text="스팀 로비 호스팅 및 참가 기능과 오디오, 비디오, 컨트롤 설정을 포함한 접근성 옵션이 내장된 멀티플레이어 템플릿입니다. 플레이어는 스팀을 통해 연결하고 로비를 호스팅하거나 참가할 수 있으며, 완성도 높은 설정 메뉴로 경험을 커스터마이징할 수 있습니다.")
LocalizedDisplayNames=(Language="ja",Text="Steam Ready")
LocalizedDescriptions=(Language="ja",Text="Steamロビーのホストと参加機能、およびオーディオ・ビデオ・コントロール設定を含むアクセシビリティオプションが内蔵されたマルチプレイヤー対応テンプレートです。プレイヤーはSteam経由で接続し、ロビーのホストや参加が可能で、充実した設定メニューで体験をカスタマイズできます。")
LocalizedDisplayNames=(Language="zh-Hans",Text="Steam Ready")
LocalizedDescriptions=(Language="zh-Hans",Text="这是一个支持多人游戏的模板，具备Steam大厅托管与加入功能，并内置音频、视频和控制设置等无障碍选项。玩家可通过Steam连接、托管或加入大厅，并通过完善的设置菜单自定义游戏体验。")
; This project uses a thumbnail as the project icon
bThumbnailAsIcon=true
ClassTypes=AdvancedSessionsGameInstance, PlayerController, GameMode, GameState, PlayerState, SaveGame
AssetTypes=Widget Blueprint, Sound Mix, Sound Class
FoldersToIgnore=Binaries
FoldersToIgnore=Build
FoldersToIgnore=Intermediate
FoldersToIgnore=Saved
FoldersToIgnore=Media
